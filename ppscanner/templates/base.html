<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <style>
    :root { color-scheme: light; }
    body { font-family: Segoe UI, sans-serif; margin: 0; color: #1b1b1b; background: #f7f7f5; }
    header, main { padding: 1rem 1.5rem; }
    header { background: #12324d; color: #fff; }
    header a { color: #fff; }
    a { color: #0b3a66; }
    table { border-collapse: collapse; width: 100%; background: #fff; }
    th, td { border: 1px solid #8a8a8a; padding: 0.45rem 0.6rem; text-align: left; vertical-align: top; }
    th { background: #e7eef3; }
    .panel { background: #fff; border: 1px solid #8a8a8a; padding: 1rem; margin: 0 0 1rem; }
    .severity { font-weight: 700; }
    nav a { margin-right: 1rem; }
  </style>
</head>
<body>
  <header>
    <strong>Power Platform Tenant Scanner</strong>
    <p>Local read-only view of snapshots on this computer. It does not change the tenant.</p>
    <nav>
      <a href="/">Snapshots</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
